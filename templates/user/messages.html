<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - House-Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F0EBE1;
            --bg-card: #FAF6EF;
            --bg-card2: #F4EEE3;
            --sand: #E8DFD0;
            --stone: #D4C8B8;
            --accent: #B8864E;
            --accent2: #D4A96A;
            --accent-dark: #96693A;
            --accent-light: #FBF3E4;
            --text-primary: #1A1612;
            --text-secondary: #4A3F35;
            --text-muted: #8A7A6E;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ── HOUSE PHOTO BACKGROUND ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: url('/static/images/Home.jpg') no-repeat center center / cover;
            opacity: 0.28;
            filter: saturate(0.3) sepia(0.85) hue-rotate(-15deg) brightness(0.95);
        }
        body::after {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse 100% 100% at 50% 50%,
                rgba(184,134,78,0.12) 0%, rgba(240,235,225,0.0) 55%, rgba(240,235,225,0.45) 100%);
        }
        .bg-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(184,134,78,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(184,134,78,0.045) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .bg-warm {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: rgba(184,134,78,0.10);
            mix-blend-mode: multiply;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: rgba(250,246,239,0.94); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--stone);
            padding: 0 44px; height: 66px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 0 rgba(184,134,78,0.12), 0 4px 20px rgba(28,22,18,0.05);
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px; font-weight: 700; color: var(--text-primary);
            display: flex; align-items: center; gap: 11px; text-decoration: none; letter-spacing: 0.3px;
        }
        .navbar-brand-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: #fff; box-shadow: 0 2px 10px rgba(184,134,78,0.35); position: relative; overflow: hidden;
        }
        .navbar-brand-icon::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent); }
        .navbar-menu { display: flex; align-items: center; gap: 2px; }
        .navbar-menu a {
            color: var(--text-secondary); text-decoration: none;
            padding: 7px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 500;
            transition: color 0.2s, background 0.2s;
            display: flex; align-items: center; gap: 6px; position: relative;
        }
        .navbar-menu a:hover, .navbar-menu a.nav-active { color: var(--accent); background: var(--accent-light); }
        .badge-notification {
            position: absolute; top: 2px; right: 2px;
            background: #DC2626; color: white; border-radius: 50%;
            width: 15px; height: 15px; display: none;
            align-items: center; justify-content: center;
            font-size: 8px; font-weight: 700; border: 2px solid var(--bg-card);
        }
        .profile-pic { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--stone); display: block; }
        .profile-placeholder {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-light), #fdecc8);
            color: var(--accent); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px; border: 2px solid var(--stone);
        }
        .nav-divider { width: 1px; height: 20px; background: var(--stone); margin: 0 5px; }
        .logout-link {
            color: var(--text-muted) !important; text-decoration: none;
            padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 5px; transition: color 0.2s, background 0.2s;
        }
        .logout-link:hover { color: #DC2626 !important; background: #FEF2F2; }

        /* ── CHAT LAYOUT ── */
        .chat-layout {
            display: flex;
            height: calc(100vh - 66px);
            position: relative; z-index: 1;
        }

        /* ── LEFT PANEL ── */
        .convos-panel {
            width: 340px; flex-shrink: 0;
            background: rgba(250,244,234,0.82);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(212,186,150,0.5);
            display: flex; flex-direction: column;
            box-shadow: 2px 0 20px rgba(150,105,58,0.06);
        }
        .convos-header {
            padding: 22px 20px 0;
            border-bottom: 1px solid rgba(212,186,150,0.3);
        }
        .convos-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px; font-weight: 700; color: var(--text-primary);
            margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
        }
        .convos-title-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        .search-wrap { position: relative; margin-bottom: 14px; }
        .search-wrap input {
            width: 100%; padding: 9px 14px 9px 38px;
            border: 1px solid rgba(212,186,150,0.5); border-radius: 20px;
            font-size: 13px; font-family: 'Outfit', sans-serif;
            background: rgba(244,238,227,0.65);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            color: var(--text-primary); transition: all 0.2s;
        }
        .search-wrap input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(184,134,78,0.12);
            background: rgba(250,244,234,0.9);
        }
        .search-wrap input::placeholder { color: var(--text-muted); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* Filter tabs */
        .filter-tabs {
            display: flex; gap: 6px; padding: 10px 16px;
            background: rgba(232,223,208,0.55);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(212,186,150,0.3);
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 5px 13px; border-radius: 16px; font-size: 12px; font-weight: 600;
            cursor: pointer; font-family: 'Outfit', sans-serif;
            border: 1px solid rgba(212,186,150,0.45);
            background: rgba(250,244,234,0.7);
            color: var(--text-secondary); transition: all 0.2s;
        }
        .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
        .filter-tab.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(184,134,78,0.28); }

        /* Conversation list */
        .convos-list { flex: 1; overflow-y: auto; }
        .convos-list::-webkit-scrollbar { width: 4px; }
        .convos-list::-webkit-scrollbar-thumb { background: rgba(212,186,150,0.4); border-radius: 2px; }

        .convo-item {
            padding: 14px 18px; border-bottom: 1px solid rgba(212,186,150,0.2);
            cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
            transition: all 0.2s;
        }
        .convo-item:hover { background: rgba(244,238,227,0.65); }
        .convo-item.active {
            background: rgba(251,243,228,0.88);
            border-left: 3px solid var(--accent);
            box-shadow: inset 0 1px 0 rgba(255,248,235,0.5);
        }
        .convo-item.unread { background: rgba(251,243,228,0.5); }
        .convo-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-light), #fdecc8);
            border: 2px solid rgba(184,134,78,0.3);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--accent);
        }
        .convo-avatar.supplier { background: linear-gradient(135deg, #EDE9FE, #DDD6FE); border-color: rgba(139,92,246,0.3); color: #6D28D9; }
        .convo-content { flex: 1; min-width: 0; }
        .convo-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
        .convo-name { font-weight: 600; font-size: 13.5px; color: var(--text-primary); }
        .convo-time { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }
        .convo-preview { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .convo-item.unread .convo-preview { font-weight: 600; color: var(--text-secondary); }
        .unread-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white; font-size: 9px; font-weight: 700;
            padding: 2px 7px; border-radius: 10px; margin-top: 4px;
        }

        /* ── CHAT PANEL ── */
        .chat-panel {
            flex: 1; display: flex; flex-direction: column;
            background: rgba(240,235,225,0.55);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .chat-header {
            padding: 16px 26px;
            border-bottom: 1px solid rgba(212,186,150,0.4);
            display: flex; align-items: center; gap: 14px;
            background: rgba(250,244,234,0.88);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 2px 14px rgba(150,105,58,0.06);
        }
        .chat-header-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-light), #fdecc8);
            border: 2px solid rgba(184,134,78,0.3);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--accent);
        }
        .chat-name { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 700; color: var(--text-primary); }
        .chat-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
        .chat-actions-right { margin-left: auto; }
        .btn-profile {
            padding: 7px 14px;
            background: rgba(244,238,227,0.72);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(212,186,150,0.45); border-radius: 9px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            color: var(--text-secondary); transition: all 0.2s; font-family: 'Outfit', sans-serif;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-profile:hover { background: rgba(250,244,234,0.9); border-color: var(--accent); color: var(--accent); }

        /* Messages area */
        .messages-area {
            flex: 1; overflow-y: auto; padding: 22px 26px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(212,186,150,0.35); border-radius: 2px; }

        .date-divider { text-align: center; position: relative; margin: 14px 0; }
        .date-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(212,186,150,0.35); }
        .date-divider span {
            background: rgba(240,235,225,0.85); backdrop-filter: blur(6px);
            padding: 4px 14px; border-radius: 12px;
            font-size: 11px; color: var(--text-muted); font-weight: 600;
            position: relative; z-index: 1;
            border: 1px solid rgba(212,186,150,0.3);
        }

        .message { display: flex; gap: 8px; align-items: flex-end; }
        .message.sent { flex-direction: row-reverse; }
        .msg-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(244,238,227,0.72);
            border: 1.5px solid rgba(212,186,150,0.4);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--text-muted);
        }
        .message.sent .msg-avatar {
            background: linear-gradient(135deg, var(--accent-light), #fdecc8);
            border-color: rgba(184,134,78,0.3);
            color: var(--accent);
        }
        .msg-content { max-width: 58%; }
        .msg-bubble {
            padding: 11px 15px; border-radius: 16px;
            background: rgba(250,244,234,0.88);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212,186,150,0.4);
            font-size: 13px; line-height: 1.55; color: var(--text-primary);
            box-shadow: 0 2px 12px rgba(150,105,58,0.07), inset 0 1px 0 rgba(255,248,235,0.5);
            word-wrap: break-word;
        }
        .message.sent .msg-bubble {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 3px 14px rgba(184,134,78,0.32);
        }
        .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; padding: 0 4px; }
        .message.sent .msg-time { text-align: right; }

        /* Input area */
        .input-area {
            padding: 14px 26px;
            border-top: 1px solid rgba(212,186,150,0.4);
            background: rgba(250,244,234,0.88);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-wrap { flex: 1; }
        .input-wrap textarea {
            width: 100%; padding: 10px 16px;
            border: 1px solid rgba(212,186,150,0.5); border-radius: 20px;
            font-size: 13.5px; font-family: 'Outfit', sans-serif;
            resize: none; max-height: 100px;
            background: rgba(244,238,227,0.7);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            color: var(--text-primary); transition: all 0.2s;
            box-shadow: inset 0 1px 0 rgba(255,248,235,0.4);
        }
        .input-wrap textarea:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(184,134,78,0.12), inset 0 1px 0 rgba(255,248,235,0.4);
            background: rgba(250,244,234,0.9);
        }
        .input-wrap textarea::placeholder { color: var(--text-muted); }
        .send-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
            box-shadow: 0 3px 12px rgba(184,134,78,0.35);
        }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 5px 18px rgba(184,134,78,0.45); }
        .send-btn:disabled { background: var(--stone); cursor: not-allowed; transform: none; box-shadow: none; }

        /* Empty states */
        .empty-chat {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); text-align: center; padding: 40px;
        }
        .empty-chat-icon {
            width: 80px; height: 80px; border-radius: 22px;
            background: rgba(244,238,227,0.72);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212,186,150,0.4);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; color: var(--accent);
            box-shadow: inset 0 1px 0 rgba(255,248,235,0.5);
        }
        .empty-chat h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-secondary); margin-bottom: 8px; font-size: 22px; font-weight: 700;
        }
        .empty-chat p { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; }

        /* Empty convos */
        .empty-convos {
            text-align: center; padding: 48px 20px; color: var(--text-muted);
        }
        .empty-convos-icon {
            width: 56px; height: 56px; border-radius: 16px;
            background: rgba(232,223,208,0.6);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px; color: var(--text-muted);
            border: 1px solid rgba(212,186,150,0.3);
        }

        /* Typing dots */
        .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: typing 1.4s infinite; display: inline-block; margin: 0 2px; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }

        @media (max-width: 768px) { .convos-panel { width: 280px; } .navbar { padding: 0 20px; } }
        @media (max-width: 580px) { .convos-panel { width: 240px; } }
    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-warm"></div>

<nav class="navbar">
    <a href="{{ url_for('user.dashboard') }}" class="navbar-brand">
        <div class="navbar-brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        House-Forge
    </a>
    <div class="navbar-menu">
        <a href="{{ url_for('user.dashboard') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Dashboard
        </a>
        <a href="{{ url_for('user.projects') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            Projects
        </a>
        <a href="/user/bids">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Bids
                <span class="badge-notification badge-amber" id="bidsBadge"></span>
            </a>
        <a href="{{ url_for('user.my_orders') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Orders
        </a>
        <a href="{{ url_for('user.messages') }}" class="nav-active" style="position:relative;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Messages
            <span class="badge-notification" id="messagesBadge"></span>
        </a>
        
        <div class="nav-divider"></div>
        <a href="{{ url_for('user.profile') }}" style="padding:8px 9px;">
            {% if user_profile_picture %}
                <img src="/static/uploads/profiles/{{ user_profile_picture }}" alt="Profile" class="profile-pic">
            {% else %}
                <div class="profile-placeholder">{{ current_user.name[0].upper() if current_user.name else 'U' }}</div>
            {% endif %}
        </a>
        <a href="{{ url_for('auth.logout') }}" class="logout-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </a>
    </div>
</nav>

<div class="chat-layout">

    <!-- ── LEFT PANEL ── -->
    <div class="convos-panel">
        <div class="convos-header">
            <div class="convos-title">
                <span class="convos-title-dot"></span>
                Messages
            </div>
            <div class="search-wrap">
                <span class="search-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input type="text" id="searchInput" placeholder="Search conversations…">
            </div>
        </div>
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="contractor">Contractors</button>
            <button class="filter-tab" data-filter="supplier">Suppliers</button>
            <button class="filter-tab" data-filter="unread">Unread</button>
        </div>
        <div class="convos-list" id="convosList"></div>
    </div>

    <!-- ── CHAT PANEL ── -->
    <div class="chat-panel" id="chatPanel">
        <div class="empty-chat">
            <div class="empty-chat-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <h2>Select a conversation</h2>
            <p>Choose a contractor or supplier<br>to start messaging</p>
        </div>
    </div>

</div>

<script>
    let conversations = [], currentConvo = null, messages = {};
    function getParam(n) { return new URLSearchParams(window.location.search).get(n); }

    document.addEventListener('DOMContentLoaded', () => { loadConvos(); setupListeners(); });

    function setupListeners() {
        document.querySelectorAll('.filter-tab').forEach(t => t.addEventListener('click', function () {
            document.querySelectorAll('.filter-tab').forEach(x => x.classList.remove('active'));
            this.classList.add('active'); filterConvos(this.dataset.filter);
        }));
        document.getElementById('searchInput').addEventListener('input', e => searchConvos(e.target.value));
    }

    function loadConvos() {
        fetch('/user/messages/conversations').then(r => r.json()).then(d => {
            conversations = d.conversations || []; renderConvos(conversations);
            const id = getParam('open'), type = getParam('type');
            if (id && type) setTimeout(() => openConvo(id, type), 500);
        }).catch(() => emptyConvos());
    }

    function contractorIcon() {
        return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`;
    }
    function supplierIcon() {
        return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`;
    }
    function userIcon() {
        return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }

    function renderConvos(cvs) {
        const el = document.getElementById('convosList');
        if (!cvs.length) { emptyConvos(); return; }
        el.innerHTML = cvs.map(c => `
            <div class="convo-item ${c.unread_count > 0 ? 'unread' : ''}" data-id="${c.id}" data-type="${c.sender_type}" onclick="openConvo('${c.id}','${c.sender_type}')">
                <div class="convo-avatar ${c.sender_type === 'supplier' ? 'supplier' : ''}" 
     onclick="event.stopPropagation(); viewProfile('${c.id}','${c.sender_type}')" 
     title="View ${c.sender_name}'s profile"
     style="cursor:pointer; transition: transform 0.2s, box-shadow 0.2s;"
     onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 4px 14px rgba(184,134,78,0.3)';"
     onmouseout="this.style.transform='';this.style.boxShadow='';">
    ${c.sender_type === 'contractor' ? contractorIcon() : supplierIcon()}
</div>
                <div class="convo-content">
                    <div class="convo-top">
                        <span class="convo-name">${c.sender_name}</span>
                        <span class="convo-time">${fmtTime(c.last_message_time)}</span>
                    </div>
                    <div class="convo-preview">${c.last_message || ''}</div>
                    ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count} new</span>` : ''}
                </div>
            </div>`).join('');
    }

    function emptyConvos() {
        document.getElementById('convosList').innerHTML = `
            <div class="empty-convos">
                <div class="empty-convos-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <p style="font-size:13px;">No messages yet</p>
            </div>`;
    }

    function openConvo(id, type) {
        currentConvo = id;
        document.querySelectorAll('.convo-item').forEach(i => {
            i.classList.remove('active');
            if (i.dataset.id === id && i.dataset.type === type) i.classList.add('active');
        });
        fetch(`/user/messages/conversation/${id}?type=${type}`).then(r => r.json()).then(d => {
            messages[id] = d.messages || []; renderChat(id, d.contact_info, type);
        });
    }

    function renderChat(id, info, type) {
        const panel = document.getElementById('chatPanel');
        const avatarHtml = type === 'contractor' ? contractorIcon() : supplierIcon();
        panel.innerHTML = `
            <div class="chat-header">
                <div class="chat-header-avatar">${avatarHtml}</div>
                <div>
                    <div class="chat-name">${info.name}</div>
                    <div class="chat-sub">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
                </div>
                
            </div>
            <div class="messages-area" id="msgsArea">${renderMsgs(id, type)}</div>
            <div class="input-area">
                <form id="msgForm" onsubmit="sendMsg(event,'${id}','${type}')">
                    <div class="input-row">
                        <div class="input-wrap">
                            <textarea id="msgInput" placeholder="Type a message…" rows="1" onkeypress="handleKey(event)"></textarea>
                        </div>
                        <button type="submit" class="send-btn" id="sendBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </form>
            </div>`;

        document.getElementById('msgInput').addEventListener('input', () => {
            const t = document.getElementById('msgInput');
            t.style.height = 'auto';
            t.style.height = Math.min(t.scrollHeight, 100) + 'px';
        });
        scrollBottom();
    }

    function renderMsgs(id, type) {
        const msgs = messages[id] || [];
        if (!msgs.length) return `<div style="text-align:center;color:var(--text-muted);margin-top:48px;font-size:13px;">Start the conversation!</div>`;
        let html = '', lastDate = null;
        msgs.forEach(m => {
            const d = new Date(m.created_at).toDateString();
            if (d !== lastDate) {
                html += `<div class="date-divider"><span>${fmtDate(m.created_at)}</span></div>`;
                lastDate = d;
            }
            const sent = m.direction === 'outgoing';
            const avatar = sent ? userIcon() : (type === 'contractor' ? contractorIcon() : supplierIcon());
            html += `<div class="message ${sent ? 'sent' : ''}">
                <div class="msg-avatar">${avatar}</div>
                <div class="msg-content">
                    <div class="msg-bubble">${escHtml(m.message)}</div>
                    <div class="msg-time">${fmtMsgTime(m.created_at)}${sent && m.read ? ' · Read' : ''}</div>
                </div>
            </div>`;
        });
        return html;
    }

    function sendMsg(e, id, type) {
        e.preventDefault();
        const input = document.getElementById('msgInput'), msg = input.value.trim();
        if (!msg) return;
        const btn = document.getElementById('sendBtn'); btn.disabled = true;
        const fd = new FormData(); fd.append('message', msg); fd.append('recipient_type', type);
        fetch(`/user/messages/send/${id}`, { method: 'POST', body: fd }).then(r => r.json()).then(d => {
            if (d.success) {
                if (!messages[id]) messages[id] = [];
                messages[id].push({ message: msg, direction: 'outgoing', created_at: new Date().toISOString(), read: false });
                renderChat(id, { name: conversations.find(c => c.id === id)?.sender_name || 'Contact' }, type);
                input.value = ''; input.style.height = 'auto'; loadConvos();
            }
        }).finally(() => btn.disabled = false);
    }

    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('msgForm').dispatchEvent(new Event('submit')); } }
    function scrollBottom() { const a = document.getElementById('msgsArea'); if (a) setTimeout(() => a.scrollTop = a.scrollHeight, 80); }

    function filterConvos(f) {
        let c = conversations;
        if (f === 'contractor') c = c.filter(x => x.sender_type === 'contractor');
        else if (f === 'supplier') c = c.filter(x => x.sender_type === 'supplier');
        else if (f === 'unread') c = c.filter(x => x.unread_count > 0);
        renderConvos(c);
    }
    function searchConvos(q) { renderConvos(conversations.filter(c => c.sender_name.toLowerCase().includes(q.toLowerCase()) || c.last_message?.toLowerCase().includes(q.toLowerCase()))); }

    function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts), now = new Date(), diff = now - d, min = Math.floor(diff / 60000); if (min < 1) return 'Now'; if (min < 60) return min + 'm'; if (diff < 86400000) return Math.floor(diff / 3600000) + 'h'; return d.toLocaleDateString(); }
    function fmtDate(ts) { const d = new Date(ts), today = new Date(), yest = new Date(today); yest.setDate(yest.getDate() - 1); if (d.toDateString() === today.toDateString()) return 'Today'; if (d.toDateString() === yest.toDateString()) return 'Yesterday'; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
    function fmtMsgTime(ts) { return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); }
    function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    setInterval(() => {
        if (currentConvo) { const t = conversations.find(c => c.id === currentConvo)?.sender_type; if (t) openConvo(currentConvo, t); }
        loadConvos();
    }, 30000);

function viewProfile(id, type) {
    if (type === 'contractor') {
        window.location = '/user/contractor/' + id;
    } else {
        window.location = '/user/supplier/' + id;
    }
}
</script>
</body>
</html>
